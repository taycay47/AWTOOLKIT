<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .input-section,
      .output-section {
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      .input-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }
      .input-group {
        display: flex;
        flex-direction: column;
      }
      textarea {
        width: 100%;
        min-height: 150px;
        margin-bottom: 10px;
        border: 2px dashed #ccc;
        color: #ccc;
        border-radius: 5px;
        resize: vertical;
      }
      .progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 10px;
        background-color: #ccc;
        overflow: hidden;
        z-index: 1000;
        -webkit-filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.25));
      }
      .progress {
        width: 0%;
        height: 100%;
        background-color: rgb(255, 153, 0);
        transition: width 0.1s ease-in-out;
        -webkit-filter: drop-shadow(10px 10px 10px rgb(255, 153, 0));
      }
      button {
        padding: 10px 20px;
        background-color: #ff9800;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:disabled {
        background-color: #cccccc;
      }
      #qrCodeList {
        list-style: none;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1rem;
      }
      #qrCodeList li {
        padding: 15px;
        background-color: #f9f9f9;
        border-radius: 5px;
        display: flex;
        align-items: flex-start;
        gap: 20px;
        overflow: hidden;
      }
      .qr-code-info {
        flex-grow: 1;
      }
      .qr-code-info .filename {
        font-weight: bold;
        margin-bottom: 4px;
      }
      .qr-code-info .url {
        color: #666;
        font-size: 0.9em;
        word-break: break-all;
      }
      #qrCodeList li svg {
        width: 150px;
        height: 150px;
        flex-shrink: 0;
      }
      .table-container {
        margin: 0;
        border: none;
        max-height: 300px;
        position: relative;
        overflow: hidden;
      }
      .table-container::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: linear-gradient(
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0.8) 40%,
          rgba(255, 255, 255, 1)
        );
        pointer-events: none;
      }
      .table-container table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }
      .table-container th,
      .table-container td {
        padding: 8px;
        border: 1px solid #ddd;
        text-align: left;
      }
      .table-container th {
        background: #f5f5f5;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .table-container tr:nth-child(even) {
        background: #f9f9f9;
      }
      .column-selectors {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }
      .selector-group {
        flex: 1;
      }
      .selector-group select {
        width: 100%;
        padding: 8px;
        margin: 5px 0;
      }
      .column-preview {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #f9f9f9;
        max-height: 100px;
        overflow: auto;
      }
      .selected-column {
        background: #e3f2fd !important;
      }
      .drag-area {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .drag-area.active {
        display: flex;
      }
      .drag-area-content {
        padding: 40px;
        background: white;
        border-radius: 10px;
        text-align: center;
        border: 3px dashed #4caf50;
      }
      .file-upload {
        margin: 20px 0;
        padding: 20px;
        border: 2px dashed #ccc;
        color: #ccc;
        border-radius: 5px;
        text-align: center;
        transition: all 0.3s ease;
      }
      .file-upload:hover {
        border-color: #ff9800;
        color: #ff9800;
      }
      .file-upload input[type="file"] {
        display: none;
      }
      .file-upload label {
        cursor: pointer;
      }
      .table-container th.selectable {
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .table-container th.selectable:hover {
        background-color: #e3f2fd;
      }
      .table-container th.selected-url {
        background-color: #ffe0b2;
      }
      .table-container th.selected-filename {
        background-color: #bbdefb;
      }
      .input-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      #configTab {
        background: #f9f9f9;
        padding: 20px;
        border-radius: 5px;
        border: 1px solid #ddd;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
      }
      .setting-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .setting-group input,
      .setting-group select {
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      .input-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        position: relative;
        width: 100%;
      }
      .tab-button {
        padding: 10px 20px;
        border: none;
        background: #ccc;
        border-radius: 5px;
        cursor: pointer;
      }
      .tab-button.active {
        background: #ff9800;
        color: white;
      }
      .tab-button.config {
        margin-left: auto;
      }
      .output-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      #downloadButtonBottom {
        margin-top: 20px;
      }
      .column-indicator {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 0.8em;
        margin-left: 8px;
        color: white;
      }
      .table-container th.selectable {
        position: relative;
        padding-top: 25px;
        padding-right: 10px;
      }
      .table-container th.selected-url {
        background-color: #fff3e0;
      }
      .table-container th.selected-filename {
        background-color: #e3f2fd;
      }
      .table-container th.selected-url::after,
      .table-container th.selected-filename::after {
        content: "URL";
        position: absolute;
        left: 50%;
        top: 5px;
        transform: translateX(-50%);
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 0.8em;
        color: white;
        white-space: nowrap;
      }
      .table-container th.selected-url::after {
        content: "URL";
        background-color: #ff9800;
      }
      .table-container th.selected-filename::after {
        content: "Name";
        background-color: #2196f3;
      }
      .generation-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .cancel-button {
        background-color: #f44336;
      }
      .cancel-button:hover {
        background-color: #d32f2f;
      }
      .progress-bar {
        flex-grow: 1;
      }
      .generate-button {
        background-color: #ff9800;
        transition: background-color 0.3s ease;
        min-width: 160px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: auto;
        margin-bottom: 20px;
      }
      .generate-button.canceling {
        background-color: #f44336;
      }
      .generate-button.canceling:hover {
        background-color: #d32f2f;
      }
      .table-container .column-highlight {
        background-color: rgba(255, 152, 0, 0.1); /* Light orange */
      }
      .table-container .column-highlight-filename {
        background-color: rgba(33, 150, 243, 0.1); /* Light blue */
      }
      /* Update QR code list text overflow */
      .qr-code-info .filename,
      .qr-code-info .url {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .download-button.cancel-button {
        background-color: #f44336;
      }
      .download-button.cancel-button:hover {
        background-color: #d32f2f;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </head>
  <body>
    <h1>QR Code Generator</h1>
    <div class="container">
      <div class="input-section">
        <div class="input-header">
          <h2>Input</h2>
        </div>

        <div class="input-tabs">
          <button class="tab-button active" onclick="switchTab('file')">
            File Upload
          </button>
          <button class="tab-button" onclick="switchTab('manual')">
            Manual Input
          </button>
          <button class="tab-button config" onclick="switchTab('config')">
            <i class="fas fa-cog"></i> Settings
          </button>
        </div>

        <div id="fileTab" class="tab-content">
          <!-- Existing file upload content -->
          <div class="file-upload">
            <label for="fileInput">
              <i class="fas fa-file-upload"></i> Choose a file or drag it here
            </label>
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
          </div>
          <div id="tablePreview" class="table-container" style="display: none">
            <table>
              <thead>
                <tr id="tableHeaders"></tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>

        <div id="manualTab" class="tab-content" style="display: none">
          <div class="input-fields">
            <div class="input-group">
              <label for="urlInput">URLs (one per line):</label>
              <textarea
                id="urlInput"
                placeholder="Enter URLs here..."
              ></textarea>
            </div>
            <div class="input-group">
              <label for="filenameInput">Filenames (one per line):</label>
              <textarea
                id="filenameInput"
                placeholder="Enter filenames here..."
              ></textarea>
            </div>
          </div>
        </div>

        <div id="configTab" class="tab-content" style="display: none">
          <div class="settings-grid">
            <div class="setting-group">
              <label for="qrSize">Size (px)</label>
              <input
                type="number"
                id="qrSize"
                value="256"
                min="128"
                max="1024"
                step="32"
              />
            </div>
            <div class="setting-group">
              <label for="qrPadding">Padding</label>
              <input type="number" id="qrPadding" value="4" min="0" max="20" />
            </div>
            <div class="setting-group">
              <label for="qrErrorLevel">Error Correction Level</label>
              <select id="qrErrorLevel">
                <option value="L">Low (7%)</option>
                <option value="M" selected>Medium (15%)</option>
                <option value="Q">Quartile (25%)</option>
                <option value="H">High (30%)</option>
              </select>
            </div>
            <div class="setting-group">
              <label for="qrForeground">Foreground Color</label>
              <input
                type="text"
                id="qrForeground"
                value="#000000"
                pattern="^#[0-9A-Fa-f]{6}$"
              />
              <div id="foregroundPicker"></div>
            </div>
            <div class="setting-group">
              <label for="qrBackground">Background Color</label>
              <input
                type="text"
                id="qrBackground"
                value="#FFFFFF"
                pattern="^#[0-9A-Fa-f]{6}$"
              />
              <div id="backgroundPicker"></div>
            </div>
          </div>
        </div>

        <button
          id="generateButton"
          class="generate-button"
          onclick="generateQRCodes()"
        >
          <i class="fas fa-qrcode"></i> Generate QR Codes
        </button>
      </div>

      <div class="output-section">
        <div class="output-header">
          <div>
            <h2>Output</h2>
            <span id="qrCounter" style="color: #666; font-size: 0.9em"
              >0 QR codes</span
            >
          </div>
          <div style="display: flex; gap: 10px">
            <button
              id="cancelButton"
              class="cancel-button"
              style="display: none"
              onclick="cancelGeneration()"
            >
              <i class="fas fa-times"></i> Cancel
            </button>
            <button id="downloadButton" disabled onclick="downloadAll()">
              Download All
            </button>
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress" id="progressBar"></div>
        </div>
        <div id="tablePreview" class="table-container" style="display: none">
          <table>
            <thead>
              <tr id="tableHeaders"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <ul id="qrCodeList"></ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode-svg@1.1.0/lib/qrcode.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script>
      let selectedUrlColumn = null;
      let selectedFilenameColumn = null;
      let tableData = null;
      let generationController = null;

      function handleFile(file) {
        const reader = new FileReader();

        reader.onload = function (e) {
          try {
            // Clear existing selections
            selectedUrlColumn = null;
            selectedFilenameColumn = null;
            document.getElementById("generateButton").disabled = true;

            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            tableData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

            displayTable(tableData);
          } catch (error) {
            alert("Error reading file: " + error.message);
          }
        };

        reader.readAsArrayBuffer(file);
      }

      function displayTable(data) {
        if (!data || data.length === 0) return;

        const headers = data[0];
        const tableHeaders = document.getElementById("tableHeaders");
        const tableBody = document.getElementById("tableBody");

        // Display headers
        tableHeaders.innerHTML = headers
          .map(
            (header, index) => `
          <th class="selectable" data-index="${index}" onclick="selectColumn(${index})">
            ${header || `Column ${index + 1}`}
          </th>
        `
          )
          .join("");

        // Display rows
        tableBody.innerHTML = data
          .slice(1)
          .map(
            (row) => `
          <tr>
            ${row.map((cell) => `<td>${cell || ""}</td>`).join("")}
          </tr>
        `
          )
          .join("");

        document.getElementById("tablePreview").style.display = "block";
      }

      function selectColumn(index) {
        const headers = document.querySelectorAll("#tableHeaders th");
        const header = headers[index];

        if (header.classList.contains("selected-url")) {
          header.classList.remove("selected-url");
          selectedUrlColumn = null;
        } else if (header.classList.contains("selected-filename")) {
          header.classList.remove("selected-filename");
          selectedFilenameColumn = null;
        } else if (!selectedUrlColumn) {
          headers.forEach((h) => h.classList.remove("selected-url"));
          header.classList.add("selected-url");
          selectedUrlColumn = index;
        } else if (!selectedFilenameColumn) {
          headers.forEach((h) => h.classList.remove("selected-filename"));
          header.classList.add("selected-filename");
          selectedFilenameColumn = index;
        }

        document.getElementById("generateButton").disabled = !(
          selectedUrlColumn !== null && selectedFilenameColumn !== null
        );
      }

      // Add event listeners
      document.addEventListener("DOMContentLoaded", function () {
        const dragArea = document.querySelector(".drag-area");
        const fileInput = document.getElementById("fileInput");

        // File input change
        fileInput.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (file) handleFile(file);
        });

        // Drag and drop events
        document.addEventListener("dragenter", (e) => {
          e.preventDefault();
          dragArea.classList.add("active");
        });

        document.addEventListener("dragleave", (e) => {
          e.preventDefault();
          if (e.relatedTarget === null) {
            dragArea.classList.remove("active");
          }
        });

        dragArea.addEventListener("dragover", (e) => {
          e.preventDefault();
        });

        dragArea.addEventListener("drop", (e) => {
          e.preventDefault();
          dragArea.classList.remove("active");

          const file = e.dataTransfer.files[0];
          const validTypes = [
            "application/vnd.ms-excel",
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
            "text/csv",
          ];

          if (validTypes.includes(file.type)) {
            handleFile(file);
          } else {
            alert("Please upload an Excel or CSV file");
          }
        });
      });

      function toggleSettings() {
        const panel = document.querySelector(".settings-panel");
        panel.style.display = panel.style.display === "none" ? "block" : "none";
      }

      function switchTab(tab) {
        // Hide all tabs
        document.querySelectorAll(".tab-button").forEach((button) => {
          button.classList.remove("active");
        });
        document.querySelectorAll(".tab-content").forEach((content) => {
          content.style.display = "none";
        });

        // Activate selected tab
        document
          .querySelector(`[onclick="switchTab('${tab}')"]`)
          .classList.add("active");
        document.getElementById(`${tab}Tab`).style.display = "block";

        // Reset generate button state based on active tab
        const generateButton = document.getElementById("generateButton");
        if (tab === "file") {
          generateButton.disabled = !(
            selectedUrlColumn !== null && selectedFilenameColumn !== null
          );
        } else {
          generateButton.disabled = false;
        }
      }

      async function generateQRCodes() {
        const generateButton = document.getElementById("generateButton");
        const downloadButton = document.getElementById("downloadButton");

        // If currently generating, cancel it and start new generation
        if (generationController) {
          generationController.abort();
        }

        // Create new abort controller for this generation
        generationController = new AbortController();
        const signal = generationController.signal;

        // Update download button to show cancel state
        downloadButton.disabled = false;
        downloadButton.classList.add("cancel-button");
        downloadButton.innerHTML = '<i class="fas fa-times"></i> Cancel';
        downloadButton.onclick = () => {
          generationController.abort();
          resetDownloadButton();
        };

        let urls, filenames;

        // Get active tab
        const isFileTab =
          document.getElementById("fileTab").style.display !== "none";

        if (isFileTab) {
          if (
            !tableData ||
            selectedUrlColumn === null ||
            selectedFilenameColumn === null
          ) {
            alert("Please select both URL and Filename columns");
            return;
          }
          urls = tableData.slice(1).map((row) => row[selectedUrlColumn]);
          filenames = tableData
            .slice(1)
            .map((row) => row[selectedFilenameColumn]);
        } else {
          const urlInput = document.getElementById("urlInput").value;
          const filenameInput = document.getElementById("filenameInput").value;
          urls = urlInput.split("\n").filter((url) => url.trim());
          filenames = filenameInput.split("\n").filter((name) => name.trim());
        }

        // Validate inputs before generation
        if (urls.length === 0 || filenames.length === 0) {
          throw new Error("URLs and filenames are required");
        }

        if (urls.length !== filenames.length) {
          throw new Error("Number of URLs must match number of filenames");
        }

        // Get QR code settings
        const settings = {
          width: parseInt(document.getElementById("qrSize").value),
          height: parseInt(document.getElementById("qrSize").value),
          padding: parseInt(document.getElementById("qrPadding").value),
          color: document.getElementById("qrForeground").value,
          background: document.getElementById("qrBackground").value,
          ecl: document.getElementById("qrErrorLevel").value,
        };

        // Clear previous QR codes and reset counter
        const qrCodeList = document.getElementById("qrCodeList");
        qrCodeList.innerHTML = "";
        document.getElementById("qrCounter").textContent = "0 QR codes";

        let generatedCount = 0;

        for (let i = 0; i < urls.length; i++) {
          // Check if cancelled
          if (signal.aborted) {
            break;
          }

          // Validate URL and filename
          if (!urls[i]?.trim()) {
            console.warn(`Skipping empty URL at index ${i}`);
            continue;
          }

          // Update progress
          const progress = ((i + 1) / urls.length) * 100;
          document.getElementById("progressBar").style.width = `${progress}%`;

          const qr = new QRCode({
            content: urls[i],
            width: 150,
            height: 150,
            padding: parseInt(document.getElementById("qrPadding").value),
            color: document.getElementById("qrForeground").value,
            background: document.getElementById("qrBackground").value,
            ecl: document.getElementById("qrErrorLevel").value,
          });

          const listItem = document.createElement("li");
          listItem.innerHTML = `
            ${qr.svg()}
            <div class="qr-code-info">
              <div class="filename">${filenames[i]}</div>
              <div class="url">${urls[i]}</div>
            </div>
          `;
          qrCodeList.appendChild(listItem);
          generatedCount++;
          document.getElementById(
            "qrCounter"
          ).textContent = `${generatedCount} QR code${
            generatedCount !== 1 ? "s" : ""
          }`;

          // Allow UI to update
          await new Promise((resolve) => setTimeout(resolve, 100));
        }

        if (!signal.aborted) {
          resetDownloadButton();
        }
      }

      // Helper function to reset download button state
      function resetDownloadButton() {
        const downloadButton = document.getElementById("downloadButton");
        downloadButton.classList.remove("cancel-button");
        downloadButton.innerHTML =
          '<i class="fas fa-download"></i> Download All';
        downloadButton.onclick = downloadAll;
        generationController = null;
      }

      async function downloadAll() {
        const downloadButton = document.getElementById("downloadButton");

        // Only proceed if not in cancel state
        if (downloadButton.classList.contains("cancel-button")) {
          return;
        }

        downloadButton.disabled = true;
        downloadButton.innerHTML =
          '<i class="fas fa-spinner fa-spin"></i> Creating ZIP...';

        try {
          const zip = new JSZip();
          const qrCodeList = document.getElementById("qrCodeList");
          const items = qrCodeList.getElementsByTagName("li");

          // Get zip filename
          let zipFilename;
          const fileInput = document.getElementById("fileInput");
          if (fileInput.files.length > 0) {
            // Use uploaded file name without extension
            zipFilename = fileInput.files[0].name.replace(/\.[^/.]+$/, "");
          } else {
            // Create timestamp-based filename
            const now = new Date();
            zipFilename =
              "qr-codes-" +
              now
                .toISOString()
                .replace(/[:.]/g, "-") // Replace : and . with -
                .replace("T", "_") // Replace T with _
                .split(".")[0]; // Remove milliseconds
          }

          // Add QR codes to zip
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            const svg = item.getElementsByTagName("svg")[0];
            const filename = item.querySelector(".filename").textContent;
            const svgData = new XMLSerializer().serializeToString(svg);

            // Add file to zip
            zip.file(`${filename}.svg`, svgData);
          }

          // Generate zip file
          const content = await zip.generateAsync({ type: "blob" });

          // Create download link
          const url = URL.createObjectURL(content);
          const link = document.createElement("a");
          link.href = url;
          link.download = `${zipFilename}.zip`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        } catch (error) {
          console.error("Error creating zip file:", error);
          alert("Error creating zip file. Please try again.");
        } finally {
          downloadButton.disabled = false;
          downloadButton.innerHTML =
            '<i class="fas fa-download"></i> Download All';
        }
      }

      function parseTableData() {
        const tableData = document.getElementById("tableData").value;
        if (!tableData.trim()) return;

        const rows = tableData.trim().split(/\r?\n/); // Handle different line endings

        // First try to detect if content is tab-separated
        let delimiter = "\t";
        let maxColumns = rows[0].split(delimiter).length;

        // If not tab-separated (only 1 column found), try newline separation
        if (maxColumns <= 1) {
          // Split by newlines and then by multiple spaces
          delimiter = /\s{2,}|\t/; // Match 2+ spaces or tabs
        }

        const headers = rows[0]
          .split(delimiter)
          .map((header) => header.trim())
          .filter((header) => header); // Remove empty headers

        // Debug logging
        console.log("Raw first row:", rows[0]);
        console.log("Split result:", rows[0].split(delimiter));

        // Update table headers
        const tableHeaders = document.getElementById("tableHeaders");
        tableHeaders.innerHTML = headers
          .map(
            (header, index) => `
          <th data-index="${index}">${header || `Column ${index + 1}`}</th>
        `
          )
          .join("");

        // Update table body
        const tableBody = document.getElementById("tableBody");
        tableBody.innerHTML = rows
          .slice(1)
          .map((row) => {
            const cells = row
              .split(delimiter)
              .map((cell) => cell.trim())
              .filter((cell) => cell); // Remove empty cells

            // Pad array if row has fewer cells than headers
            while (cells.length < headers.length) cells.push("");

            return `<tr>${cells
              .map((cell) => `<td>${cell}</td>`)
              .join("")}</tr>`;
          })
          .join("");

        // Update column selectors
        const urlSelect = document.getElementById("urlColumn");
        const filenameSelect = document.getElementById("filenameColumn");
        urlSelect.innerHTML = '<option value="">Select column</option>';
        filenameSelect.innerHTML = '<option value="">Select column</option>';

        headers.forEach((header, index) => {
          const headerText = header || `Column ${index + 1}`;
          urlSelect.add(new Option(headerText, index));
          filenameSelect.add(new Option(headerText, index));
        });

        // Debug logging
        console.log("Delimiter:", delimiter);
        console.log("Number of columns:", headers.length);
        console.log("Headers:", headers);
        console.log(
          "First row cells:",
          rows[1]
            ?.split(delimiter)
            .map((cell) => cell.trim())
            .filter((cell) => cell)
        );

        return {
          headers,
          rows: rows.slice(1).map((row) =>
            row
              .split(delimiter)
              .map((cell) => cell.trim())
              .filter((cell) => cell)
          ),
        };
      }

      function updateColumnPreview() {
        const urlColIndex = document.getElementById("urlColumn").value;
        const filenameColIndex =
          document.getElementById("filenameColumn").value;

        // Reset previous highlights
        document.querySelectorAll("th, td").forEach((cell) => {
          cell.classList.remove("selected-column");
        });

        // Highlight selected columns and update previews
        if (urlColIndex !== "") {
          highlightColumn(urlColIndex, "url");
          updatePreview("urlPreview", urlColIndex);
        }

        if (filenameColIndex !== "") {
          highlightColumn(filenameColIndex, "filename");
          updatePreview("filenamePreview", filenameColIndex);
        }
      }

      function highlightColumn(index, type) {
        // Remove previous highlights
        document
          .querySelectorAll(".column-highlight, .column-highlight-filename")
          .forEach((cell) => {
            cell.classList.remove(
              "column-highlight",
              "column-highlight-filename"
            );
          });

        // Add new highlights
        const cells = document.querySelectorAll(
          `th:nth-child(${parseInt(index) + 1}), td:nth-child(${
            parseInt(index) + 1
          })`
        );

        const highlightClass =
          type === "url" ? "column-highlight" : "column-highlight-filename";
        cells.forEach((cell) => cell.classList.add(highlightClass));
      }

      function updatePreview(previewId, columnIndex) {
        const preview = document.getElementById(previewId);
        const values = Array.from(
          document.querySelectorAll(
            `#tableBody td:nth-child(${parseInt(columnIndex) + 1})`
          )
        )
          .map((cell) => cell.textContent.trim())
          .filter((text) => text)
          .slice(0, 5);

        preview.innerHTML =
          values.map((value) => `<div>${value}</div>`).join("") +
          (values.length > 5 ? "<div>...</div>" : "");
      }

      // Event listeners
      document.getElementById("tableData").addEventListener("paste", () => {
        setTimeout(() => {
          parseTableData();
          updateColumnPreview();
        }, 0);
      });

      document
        .getElementById("urlColumn")
        .addEventListener("change", updateColumnPreview);
      document
        .getElementById("filenameColumn")
        .addEventListener("change", updateColumnPreview);

      // Initialize color pickers
      const pickrOptions = {
        theme: "classic",
        components: {
          preview: true,
          opacity: false,
          hue: true,
          interaction: {
            hex: true,
            input: true,
            clear: false,
            save: false,
          },
        },
      };

      // Create foreground picker
      const foregroundPickr = Pickr.create({
        el: "#foregroundPicker",
        default: "#000000",
        ...pickrOptions,
      });

      // Create background picker
      const backgroundPickr = Pickr.create({
        el: "#backgroundPicker",
        default: "#FFFFFF",
        ...pickrOptions,
      });

      // Handle color changes
      foregroundPickr.on("change", (color) => {
        document.getElementById("qrForeground").value = color
          .toHEXA()
          .toString();
      });

      backgroundPickr.on("change", (color) => {
        document.getElementById("qrBackground").value = color
          .toHEXA()
          .toString();
      });

      // Update settings panel visibility
      function switchTab(tab) {
        // Hide all tabs
        document.querySelectorAll(".tab-button").forEach((button) => {
          button.classList.remove("active");
        });
        document.querySelectorAll(".tab-content").forEach((content) => {
          content.style.display = "none";
        });

        // Activate selected tab
        document
          .querySelector(`[onclick="switchTab('${tab}')"]`)
          .classList.add("active");
        document.getElementById(`${tab}Tab`).style.display = "block";

        // Reset generate button state based on active tab
        const generateButton = document.getElementById("generateButton");
        if (tab === "file") {
          generateButton.disabled = !(
            selectedUrlColumn !== null && selectedFilenameColumn !== null
          );
        } else {
          generateButton.disabled = false;
        }
      }
    </script>
  </body>
</html>
